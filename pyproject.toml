[project]
name = "amchan-mvp"
version = "0.1.0"
description = "Assistente de Governança e Gestão de Conhecimento Corporativo (RH)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "streamlit>=1.35.0",
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-openai>=0.1.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "python-dotenv>=1.0.0",
    "langchain-huggingface>=0.0.3",
    "langchain-chroma>=0.1.1",
]

[tool.ruff]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
select = ["E4", "E7", "E9", "F"]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Set the max line length to 88.
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
